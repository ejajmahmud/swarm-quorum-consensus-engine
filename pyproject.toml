[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-quorum-consensus-engine"
version = "0.1.0"
description = "Byzantine fault-tolerant and weighted quorum voting protocol for verifiable multi-agent group decisions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
swarm-quorum-consensus-engine = "swarm_quorum_consensus_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm_quorum_consensus_engine*"]
